name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice
        if: ${{ hashFiles('server/package-lock.json') == '' }}
        run: echo "server/package-lock.json belum ada, job server dilewati."

      - name: Setup Node.js
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        run: npm run lint --if-present

      - name: Format check
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        run: npm run format:check --if-present

      - name: Test
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        run: npm test --if-present